name: Deploy Preview

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_CF_BEACON_TOKEN: ${{ secrets.VITE_CF_BEACON_TOKEN }}
      - name: Deploy branch preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Skipping preview deploy — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            echo "See docs/CLOUDFLARE_DEPLOY.md"
            exit 0
          fi
          npx wrangler pages deploy dist \
            --project-name onesixtwo \
            --branch "${{ github.ref_name }}" \
            --commit-dirty=true
      - name: Smoke test preview APIs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Skipping preview smoke test — Cloudflare secrets not configured."
            exit 0
          fi
          PREVIEW_URL="https://${{ github.ref_name }}.onesixtwo.pages.dev"
          echo "Waiting for preview at $PREVIEW_URL"
          sleep 15
          QA_BASE_URL="$PREVIEW_URL" npm run qa:live || {
            echo "::warning::Preview smoke test failed — check D1 Preview binding and USE_LIVE_FIXTURES"
            exit 0
          }
